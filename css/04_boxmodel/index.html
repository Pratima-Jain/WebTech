<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* box-sizing: content-box; */
        }
        .box1 {
            height: 200px;
            width: 200px;
            background-color: yellow;
            border: 10px solid black;
            padding: 50px;
            margin: 50px;
        }
        .box2 {
            height: 200px;
            width: 200px;
            border: 10px solid black;
            padding: 80px;
            background-color: red;
        }
    </style>
</head>

<body>

    <h1>learn box model</h1>
    <!-- 
     ! there are 4 components in box model
     1) content : space occupied by data
     2) padding : space between data and border
     3) border :  outline on the element
     4) margin :space around element 
     -->

    <div class="box1">box1</div>
    <div class="box2">box2</div>






</body>

</html>
